# Refreshes the dynamic blocks of README.md.
# Triggers: daily schedule, manual run, and edits to now.json / config / the script on main.
# Permissions: contents: write only. No secrets beyond the built-in GITHUB_TOKEN.
# Note: GitHub disables scheduled workflows after 60 days without repository activity.
name: Update profile README

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - now.json
      - config/projects.json
      - scripts/update_readme.py

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Regenerate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile README"
          git pull --rebase
          git push
